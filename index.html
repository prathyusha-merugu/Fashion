<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion Store</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
    }

    header{
      background:black;
      color:white;
      padding:15px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      font-size:28px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:16px;
    }

    .hero{
      height:400px;
      background:url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1200') center/cover;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      text-align:center;
    }

    .hero h2{
      font-size:50px;
      background:rgba(0,0,0,0.5);
      padding:20px;
      border-radius:10px;
    }

    .products{
      padding:50px;
    }

    .products h2{
      text-align:center;
      margin-bottom:30px;
      font-size:35px;
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:300px;
      object-fit:cover;
    }

    .card-content{
      padding:15px;
      text-align:center;
    }

    .card-content h3{
      margin-bottom:10px;
    }

    .price{
      color:green;
      font-size:20px;
      margin-bottom:15px;
    }

    button{
      background:black;
      color:white;
      border:none;
      padding:10px 20px;
      cursor:pointer;
      border-radius:5px;
    }

    button:hover{
      background:#444;
    }

    footer{
      background:black;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>FashionHub</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#">Women</a>
      <a href="#">Men</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>New Fashion Collection 2026</h2>
  </section>

  <section class="products">
    <h2>Trending Products</h2>

    <div class="product-grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=800" alt="Dress">

        <div class="card-content">
          <h3>Elegant Dress</h3>
          <p class="price">₹2,499</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=800" alt="Fashion">

        <div class="card-content">
          <h3>Stylish Outfit</h3>
          <p class="price">₹3,199</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=800" alt="Women Fashion">

        <div class="card-content">
          <h3>Modern Wear</h3>
          <p class="price">₹1,999</p>
          <button>Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 FashionHub. All Rights Reserved.</p>
  </footer>

</body>
</html>
